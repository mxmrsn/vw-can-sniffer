name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: Host tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9" }   # what macOS ships; the tools must keep working on it
          - { os: ubuntu-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Firmware unit tests (sanitizers on)
        run: make -C hardware/pico2w/firmware/tests
      - name: Build the simulator
        run: make -C hardware/pico2w/firmware/sim
      - name: Tool tests against the simulator
        run: python3 -m unittest discover -s tools/tests -v

  firmware:
    name: Pico 2 W firmware build
    runs-on: ubuntu-latest
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install the Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Fetch the Pico SDK
        run: |
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" submodule update --init --depth 1 lib/tinyusb lib/btstack lib/cyw43-driver
      - name: Build for every supported Pico board
        working-directory: hardware/pico2w/firmware
        run: |
          for board in pico2_w pico_w pico2 pico; do
            echo "::group::$board"
            cmake -B "build-$board" -DPICO_BOARD="$board"
            cmake --build "build-$board" -j
            echo "::endgroup::"
          done
          cp "build-pico2_w/vw_diag.uf2" .
      - uses: actions/upload-artifact@v4
        with:
          name: vw_diag-uf2
          path: hardware/pico2w/firmware/vw_diag.uf2

  esp32:
    name: XIAO ESP32-S3 firmware build
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        working-directory: hardware/xiao-esp32s3/firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: vw_diag-esp32s3-bin
          path: hardware/xiao-esp32s3/firmware/build/vw_diag.bin
