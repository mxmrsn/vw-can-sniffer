[platformio]
; Keep platformio project coexisting with Arduino sketches

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ESP32 UART gateway sketch
src_dir = firmware/esp32

; Web assets live here for SPIFFS/LittleFS upload
board_build.filesystem = spiffs
board_build.spiffs_start = 0x290000
board_build.spiffs_size = 0x170000

; Serial monitor speed
monitor_speed = 115200
