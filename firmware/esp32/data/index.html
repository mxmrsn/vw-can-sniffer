<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VW CAN Sniffer</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <h1>VW CAN Sniffer</h1>
  <div id="status">Connecting...</div>

  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="modeBtn">Toggle Mode</button>
    <button id="silentBtn">Toggle Silent</button>
    <input id="filterInput" type="text" placeholder="Filter IDs (hex, e.g. 123,7E8,18DAF110)" />
    <input id="labelSearch" type="text" placeholder="Filter by label text" />
    <label><input id="onlyFilter" type="checkbox" /> Show only filtered IDs</label>
  </div>
  <div id="devState">Device: unknown</div>

  <div class="row">
    <div class="column main">
      <div class="card" id="chartCard">
        <div class="card-header">
          <strong>Live Plot</strong>
          <button id="toggleChartBtn" class="ghost">Hide</button>
        </div>
        <div class="plot-controls">
          <label>Observed ID<select id="idSelect"><option value="">Auto</option></select></label>
          <label>Byte<select id="byteSelect">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
          </select></label>
          <label>Labeled Signal<select id="labelSelect"><option value="">None</option></select></label>
        </div>
        <canvas id="chart" width="560" height="160"></canvas>
      </div>
      <div class="card">
        <div><strong>Recent Frames</strong></div>
          <table>
            <thead><tr><th>ts(us)</th><th>id</th><th>payload</th><th>data</th></tr></thead>
          <tbody id="frames"></tbody>
        </table>
      </div>
    </div>
    <div class="column side">
      <div class="card">
        <div><strong>Labels</strong></div>
        <div class="label-row">
          <input id="labelId" type="text" placeholder="ID (hex)" />
          <input id="labelByte" type="text" placeholder="Byte (0-7 or blank)" />
          <input id="labelName" type="text" placeholder="Label" />
          <button id="addLabelBtn">Add/Update</button>
        </div>
        <div class="label-row">
          <button id="exportLabelsBtn">Export</button>
          <label class="file-btn">Import<input id="importLabelsInput" type="file" accept="application/json" /></label>
        </div>
        <table>
          <thead><tr><th>id</th><th>byte</th><th>label</th><th></th></tr></thead>
          <tbody id="labels"></tbody>
        </table>
        <div class="hint">Stored locally in your browser.</div>
      </div>
      <div class="card">
        <div><strong>Stats</strong></div>
        <div id="stats"></div>
        <div class="hint">Heartbeat LED should blink every 0.5s</div>
        <div class="spacer"></div>
        <div><strong>Per-ID</strong></div>
        <table>
          <thead><tr><th>id</th><th>rate</th><th>last seen</th></tr></thead>
          <tbody id="perId"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
