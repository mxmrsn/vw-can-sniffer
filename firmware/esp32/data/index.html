<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VW CAN Sniffer</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <h1>VW CAN Sniffer</h1>
  <div id="status">Connecting...</div>

  <div class="row">
    <div class="card">
      <div><strong>Recent Frames</strong></div>
      <table>
        <thead><tr><th>ts(us)</th><th>id</th><th>dlc</th><th>data</th></tr></thead>
        <tbody id="frames"></tbody>
      </table>
    </div>
    <div class="card">
      <div><strong>Stats</strong></div>
      <div id="stats"></div>
      <div class="hint">Heartbeat LED should blink every 0.5s</div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
